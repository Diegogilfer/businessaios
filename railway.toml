# ============================================================
# BusinessAIOS — Railway config
# Deploy automático al hacer push a main
# ============================================================

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "businessaios-backend"

[[services]]
name = "businessaios-frontend"
source = "frontend"
