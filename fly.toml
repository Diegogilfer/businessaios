# ============================================================
# BusinessAIOS — Fly.io config
# Deploy: fly deploy
# ============================================================

app = "businessaios"
primary_region = "gru"   # São Paulo — más cercano a Colombia

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT    = "8080"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = "1gb"
  cpus   = 1
