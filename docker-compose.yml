# ============================================================
# BusinessAIOS v1.3.0 — Docker Compose
#
# Deploy rápido (sin nginx/SSL):
#   docker-compose up -d backend frontend
#
# Deploy producción completo (con nginx + SSL):
#   docker-compose --profile production up -d
# ============================================================

version: '3.9'

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baios_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_ENV:  ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval:     30s
      timeout:      10s
      start_period: 20s
      retries:      3
    networks:
      - baios_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: baios_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:              production
      NEXT_PUBLIC_API_URL:   ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - baios_net

  # Solo activo con: docker-compose --profile production up
  nginx:
    image: nginx:alpine
    container_name: baios_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - baios_net
    profiles:
      - production

networks:
  baios_net:
    driver: bridge

volumes:
  nginx_logs:
